[project]
name = "foundry-worker"
version = "0.1.0"
description = "Foundry Arq worker (ingest, scan, summarize)"
requires-python = ">=3.11"
dependencies = [
    "arq>=0.26.3",
    "redis>=5.2.0",
    "foundry-core",
    "foundry-git",
    "foundry-analysis",
    "foundry-hooks-sdk",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/foundry_worker"]
