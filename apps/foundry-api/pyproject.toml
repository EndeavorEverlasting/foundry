[project]
name = "foundry-api"
version = "0.1.0"
description = "Foundry FastAPI service"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.5",
    "uvicorn[standard]>=0.32.0",
    "arq>=0.26.3",
    "redis>=5.2.0",
    "python-multipart>=0.0.12",
    "alembic>=1.14.0",
    "foundry-core",
    "foundry-git",
    "foundry-analysis",
    "foundry-hooks-sdk",
    "foundry-policy",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/foundry_api"]
