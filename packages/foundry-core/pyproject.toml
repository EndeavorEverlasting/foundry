[project]
name = "foundry-core"
version = "0.1.0"
description = "Foundry shared schemas, evidence model, settings, and DB session"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "sqlmodel>=0.0.22",
    "sqlalchemy[asyncio]>=2.0.35",
    "asyncpg>=0.30.0",
    "psycopg[binary]>=3.2.3",
    "greenlet>=3.1.1",
    "structlog>=24.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/foundry_core"]

[tool.hatch.build.targets.sdist]
include = ["src/foundry_core"]
