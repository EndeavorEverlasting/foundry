[project]
name = "foundry-analysis"
version = "0.1.0"
description = "Foundry analysis engine: drift, stale, capabilities, summaries, readiness"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.9.0",
    "foundry-core",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/foundry_analysis"]
