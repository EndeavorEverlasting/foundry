[project]
name = "foundry-hooks-sdk"
version = "0.1.0"
description = "FoundryHooks SDK (Python): manifest schema, loader, validator"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.9.0",
    "jsonschema>=4.23.0",
    "foundry-core",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/foundry_hooks_sdk"]
