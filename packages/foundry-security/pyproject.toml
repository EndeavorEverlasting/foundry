[project]
name = "foundry-security"
version = "0.1.0"
description = "GuardFoundry shared building blocks (stub). Seams only in v1."
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.9.0",
    "foundry-core",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/foundry_security"]
